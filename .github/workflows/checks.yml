name: Node.js CI

on:
  push:
    branches: [ live ]
  pull_request:
    branches: [ live ]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      #- run: npm ci
      - name: Install and Build 🔧
        run: |
          npm install 
          npm run build:ci
      #- run: npm test